name: CI & Publish

on:
  push:
    branches: ["main"]
    tags: ["v*", "[0-9]*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      # coverage run (not --cov): the plugin is imported via its entry point
      # before pytest-cov would start measuring.
      - run: uv run coverage run -m pytest
      - run: uv run coverage report

  test-lowest:
    name: test (lowest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e ".[all]"
      - run: .venv/bin/python -m pytest

  test-no-sdks:
    name: test (without cloud SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv venv
      - run: uv pip install -e .
      - run: .venv/bin/python -m pytest

  publish:
    name: Publish to PyPI
    needs: [lint, test, test-lowest, test-no-sdks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fingest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
