[project]
name = "fingest"
version = "2.0.0"
description = "Pytest plugin for data-driven fixtures and local simulation of AWS S3, Google Cloud Storage and Azure Blob Storage."
authors = [{ name = "Tim Fiedler", email = "tim@0x68.de" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
  "pytest", "plugin", "fixtures", "data-driven", "testing", "mock",
  "s3", "gcs", "azure-blob", "boto3", "json", "csv", "xml",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Testing :: Mocking",
  "Typing :: Typed",
]
dependencies = [
  "pytest>=8.0",
  "lxml>=5.4",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
gcp = ["google-cloud-storage>=2.10"]
azure = ["azure-storage-blob>=12.19"]
all = ["fingest[aws,gcp,azure]"]

[project.entry-points.pytest11]
fingest = "fingest.plugin"

[project.urls]
Homepage = "https://github.com/0x68/fingest"
Repository = "https://github.com/0x68/fingest"
Issues = "https://github.com/0x68/fingest/issues"
Documentation = "https://github.com/0x68/fingest#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingest"]

[dependency-groups]
dev = [
  "pytest-cov>=6.0",
  "ruff>=0.15",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "boto3>=1.34",
  "google-cloud-storage>=2.10",
  "azure-storage-blob>=12.19",
  "lxml-stubs>=0.5.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018"]
"src/fingest/cloud/__init__.py" = ["F401"]  # lazy re-exports for type checkers

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/fingest"]

[[tool.mypy.overrides]]
# Optional cloud SDKs ship without (complete) type information.
module = ["boto3.*", "botocore.*", "google.*", "azure.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google.api_core exception constructors are unannotated.
module = ["fingest.cloud.gcs"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-p", "pytester", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
fingest_fixture_path = "tests/data"
fingest_s3_root = "tests/data/s3"
fingest_gcs_root = "tests/data/gcs"
fingest_azure_root = "tests/data/azure"
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["fingest"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
